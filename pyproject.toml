[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opal-portal"
version = "1.0.0"
description = "OPAL: joint early warning and resource recommendation with temporal learner-resource graphs for an open-university portal"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Anuar Baikonys" }, { name = "Serik Zhuzbayev" }, { name = "Gulnur Alkhanova" }, { name = "Aknur Adilova" },
  { name = "Diana Sabitova" }, { name = "Bahit Juzbayeva" }, { name = "Magzhan Sarsenbay" },
]
dependencies = [
  "torch>=2.2", "torch_geometric>=2.5", "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "scipy>=1.11",
  "scikit-learn>=1.4", "xgboost>=2.0", "lightgbm>=4.3", "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["opal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
